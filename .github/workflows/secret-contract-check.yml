name: Secret contract check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.example'
      - 'docs/github-secrets.md'
      - '.github/workflows/secret-contract-check.yml'

jobs:
  check-secret-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret placeholders
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          APP_URL: ${{ secrets.APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          EMAIL_HASH_SECRET: ${{ secrets.EMAIL_HASH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DOWNLOAD_TOKEN_SECRET: ${{ secrets.DOWNLOAD_TOKEN_SECRET }}
          INTERNAL_FREE_ACCESS_EMAIL_HASHES: ${{ secrets.INTERNAL_FREE_ACCESS_EMAIL_HASHES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
        run: |
          missing=0
          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            else
              echo "Configured: $name"
            fi
          }

          check_secret APP_ENV "$APP_ENV"
          check_secret APP_URL "$APP_URL"
          check_secret DATABASE_URL "$DATABASE_URL"
          check_secret REDIS_URL "$REDIS_URL"
          check_secret EMAIL_HASH_SECRET "$EMAIL_HASH_SECRET"
          check_secret ENCRYPTION_KEY "$ENCRYPTION_KEY"
          check_secret DOWNLOAD_TOKEN_SECRET "$DOWNLOAD_TOKEN_SECRET"
          check_secret INTERNAL_FREE_ACCESS_EMAIL_HASHES "$INTERNAL_FREE_ACCESS_EMAIL_HASHES"
          check_secret RESEND_API_KEY "$RESEND_API_KEY"
          check_secret MERCADO_PAGO_ACCESS_TOKEN "$MERCADO_PAGO_ACCESS_TOKEN"
          check_secret MERCADO_PAGO_WEBHOOK_SECRET "$MERCADO_PAGO_WEBHOOK_SECRET"

          if [ "$missing" -eq 1 ]; then
            echo "One or more required secrets are missing. Configure them in GitHub repository settings or in the deployment provider."
            exit 1
          fi

          echo "Secret contract check completed without exposing secret values."
